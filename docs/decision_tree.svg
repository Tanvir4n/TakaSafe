<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background:#0D1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="dt-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B949E" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="45" fill="#F0F6FC" font-size="22" font-weight="700">TakaSafe Policy &amp; Action Decision Tree</text>
  <text x="40" y="68" fill="#8B949E" font-size="12">Deterministic Risk Threshold Mapping adhering to Bangladesh Bank BFIU Regulations</text>

  <!-- Root: Transaction Input -->
  <rect x="360" y="95" width="280" height="50" rx="8" fill="#161B22" stroke="#38BDF8" stroke-width="1.5" />
  <text x="500" y="125" fill="#38BDF8" font-size="13" font-weight="700" text-anchor="middle">Incoming Transaction Evaluation</text>

  <!-- Model Fusion Node -->
  <rect x="340" y="185" width="320" height="50" rx="8" fill="#1C2128" stroke="#30363D" stroke-width="1.2" />
  <text x="500" y="215" fill="#F0F6FC" font-size="12" font-weight="600" text-anchor="middle">Fused Risk Score Computation (0 - 100)</text>

  <line x1="500" y1="145" x2="500" y2="183" stroke="#8B949E" stroke-width="1.5" marker-end="url(#dt-arrow)" />

  <!-- 4 Risk Branches -->
  <!-- Branch Lines -->
  <path d="M 500 235 L 500 255 L 140 255 L 140 290" fill="none" stroke="#10B981" stroke-width="1.5" marker-end="url(#dt-arrow)" />
  <path d="M 500 235 L 500 255 L 380 255 L 380 290" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#dt-arrow)" />
  <path d="M 500 235 L 500 255 L 620 255 L 620 290" fill="none" stroke="#FB923C" stroke-width="1.5" marker-end="url(#dt-arrow)" />
  <path d="M 500 235 L 500 255 L 860 255 L 860 290" fill="none" stroke="#F43F5E" stroke-width="1.5" marker-end="url(#dt-arrow)" />

  <!-- Tier 1: Low Risk (0 - 30) -->
  <g transform="translate(30, 295)">
    <rect x="0" y="0" width="220" height="110" rx="8" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1.5" />
    <text x="110" y="26" fill="#34D399" font-size="13" font-weight="800" text-anchor="middle">LOW RISK (0 - 30)</text>
    <text x="110" y="48" fill="#E6EDF3" font-size="11" font-weight="600" text-anchor="middle">Straight-Through Processing</text>
    <line x1="20" y1="58" x2="200" y2="58" stroke="#10B981" stroke-opacity="0.4" />
    <text x="110" y="78" fill="#8B949E" font-size="10" text-anchor="middle">Zero Friction Approval</text>
    <text x="110" y="94" fill="#8B949E" font-size="10" text-anchor="middle">Immediate Fund Settlement</text>
  </g>

  <!-- Tier 2: Medium Risk (31 - 60) -->
  <g transform="translate(270, 295)">
    <rect x="0" y="0" width="220" height="110" rx="8" fill="#78350F" fill-opacity="0.3" stroke="#FBBF24" stroke-width="1.5" />
    <text x="110" y="26" fill="#FCD34D" font-size="13" font-weight="800" text-anchor="middle">MEDIUM RISK (31 - 60)</text>
    <text x="110" y="48" fill="#E6EDF3" font-size="11" font-weight="600" text-anchor="middle">Step-Up Authentication</text>
    <line x1="20" y1="58" x2="200" y2="58" stroke="#FBBF24" stroke-opacity="0.4" />
    <text x="110" y="78" fill="#8B949E" font-size="10" text-anchor="middle">SMS OTP / Biometric Verify</text>
    <text x="110" y="94" fill="#8B949E" font-size="10" text-anchor="middle">Velocity Surveillance Watch</text>
  </g>

  <!-- Tier 3: High Risk (61 - 80) -->
  <g transform="translate(510, 295)">
    <rect x="0" y="0" width="220" height="110" rx="8" fill="#7C2D12" fill-opacity="0.3" stroke="#FB923C" stroke-width="1.5" />
    <text x="110" y="26" fill="#FDBA74" font-size="13" font-weight="800" text-anchor="middle">HIGH RISK (61 - 80)</text>
    <text x="110" y="48" fill="#E6EDF3" font-size="11" font-weight="600" text-anchor="middle">ScamShield Intercept</text>
    <line x1="20" y1="58" x2="200" y2="58" stroke="#FB923C" stroke-opacity="0.4" />
    <text x="110" y="78" fill="#8B949E" font-size="10" text-anchor="middle">Nocturnal Warning Prompt</text>
    <text x="110" y="94" fill="#8B949E" font-size="10" text-anchor="middle">24-Hour Cooling-Off Window</text>
  </g>

  <!-- Tier 4: Critical Risk (81 - 100) -->
  <g transform="translate(750, 295)">
    <rect x="0" y="0" width="220" height="110" rx="8" fill="#881337" fill-opacity="0.3" stroke="#F43F5E" stroke-width="1.5" />
    <text x="110" y="26" fill="#FDA4AF" font-size="13" font-weight="800" text-anchor="middle">CRITICAL (81 - 100)</text>
    <text x="110" y="48" fill="#E6EDF3" font-size="11" font-weight="600" text-anchor="middle">Instant Quarantine &amp; STR</text>
    <line x1="20" y1="58" x2="200" y2="58" stroke="#F43F5E" stroke-opacity="0.4" />
    <text x="110" y="78" fill="#8B949E" font-size="10" text-anchor="middle">Mule Cluster Node Isolated</text>
    <text x="110" y="94" fill="#8B949E" font-size="10" text-anchor="middle">Auto-Draft BFIU Dossier</text>
  </g>

  <!-- Bottom Regulatory Assurance -->
  <rect x="200" y="465" width="600" height="70" rx="8" fill="#161B22" stroke="#30363D" />
  <text x="500" y="495" fill="#E6EDF3" font-size="12" font-weight="700" text-anchor="middle">Regulatory Compliance Enforcement Matrix</text>
  <text x="500" y="518" fill="#8B949E" font-size="11" text-anchor="middle">Bangladesh Bank PSD Circular 12 · Anti-Money Laundering Act 2012 · BFIU STR Submission</text>
</svg>
