<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background:#11141C; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C084FC" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399" />
    </marker>
  </defs>

  <!-- ==================== HEADER ==================== -->
  <text x="50" y="55" fill="#F8FAFC" font-size="28" font-weight="700" letter-spacing="-0.5">Architecture</text>
  <text x="50" y="80" fill="#94A3B8" font-size="13" font-weight="400">TakaSafe Multi-Modal AI Financial Trust, Explainable Fraud Shield &amp; Disaster Resilience</text>

  <!-- Badges in Top-Right -->
  <g transform="translate(1010, 36)">
    <!-- data synthetic badge -->
    <rect x="0" y="0" width="112" height="26" rx="4" fill="#1E293B" stroke="#334155" />
    <text x="10" y="17" fill="#94A3B8" font-size="11" font-weight="600">data</text>
    <rect x="42" y="0" width="70" height="26" rx="4" fill="#A3E635" />
    <text x="49" y="17" fill="#0F172A" font-size="11" font-weight="800">synthetic</text>

    <!-- license MIT badge -->
    <g transform="translate(122, 0)">
      <rect x="0" y="0" width="96" height="26" rx="4" fill="#1E293B" stroke="#334155" />
      <text x="10" y="17" fill="#94A3B8" font-size="11" font-weight="600">license</text>
      <rect x="52" y="0" width="44" height="26" rx="4" fill="#3B82F6" />
      <text x="61" y="17" fill="#FFFFFF" font-size="11" font-weight="800">MIT</text>
    </g>
  </g>

  <!-- ==================== 1. FRONTEND LAYER (LEFT BOX) ==================== -->
  <g transform="translate(50, 115)">
    <!-- Container -->
    <rect x="0" y="0" width="220" height="430" rx="10" fill="#181D28" stroke="#2B3344" stroke-width="1.2" />
    <text x="110" y="32" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">React 19 on Cloud Run</text>

    <!-- Sub-boxes -->
    <!-- Homepage + Overview -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="180" height="68" rx="6" fill="#0F131D" stroke="#2B3344" stroke-width="1" />
      <text x="90" y="32" fill="#F1F5F9" font-size="12" font-weight="600" text-anchor="middle">Homepage + Overview</text>
      <text x="90" y="48" fill="#64748B" font-size="10" text-anchor="middle">Risk Radar &amp; Ticker</text>
    </g>

    <!-- Customer (ScamShield) -->
    <g transform="translate(20, 134)">
      <rect x="0" y="0" width="180" height="68" rx="6" fill="#0F131D" stroke="#2B3344" stroke-width="1" />
      <text x="90" y="32" fill="#F1F5F9" font-size="12" font-weight="600" text-anchor="middle">Customer (ScamShield)</text>
      <text x="90" y="48" fill="#64748B" font-size="10" text-anchor="middle">24h Cooling-Off Window</text>
    </g>

    <!-- MuleVision (D3 Graph) -->
    <g transform="translate(20, 216)">
      <rect x="0" y="0" width="180" height="68" rx="6" fill="#0F131D" stroke="#2B3344" stroke-width="1" />
      <text x="90" y="32" fill="#F1F5F9" font-size="12" font-weight="600" text-anchor="middle">MuleVision (D3 Graph)</text>
      <text x="90" y="48" fill="#64748B" font-size="10" text-anchor="middle">Syndicate Ring Quarantine</text>
    </g>

    <!-- Disaster & Float Ops -->
    <g transform="translate(20, 298)">
      <rect x="0" y="0" width="180" height="68" rx="6" fill="#0F131D" stroke="#2B3344" stroke-width="1" />
      <text x="90" y="32" fill="#F1F5F9" font-size="12" font-weight="600" text-anchor="middle">Disaster &amp; Float Ops</text>
      <text x="90" y="48" fill="#64748B" font-size="10" text-anchor="middle">8-Division Climate Forecast</text>
    </g>

    <!-- BFIU Compliance Portal -->
    <g transform="translate(20, 380)">
      <rect x="0" y="0" width="180" height="36" rx="6" fill="#0F131D" stroke="#2B3344" stroke-width="1" />
      <text x="90" y="22" fill="#FBBF24" font-size="11" font-weight="600" text-anchor="middle">BFIU STR Compliance</text>
    </g>
  </g>

  <!-- ==================== 2. API GATEWAY CONNECTOR ==================== -->
  <g transform="translate(315, 290)">
    <polygon points="12,0 185,0 173,64 0,64" fill="#151A24" stroke="#38BDF8" stroke-width="1.3" />
    <text x="92" y="32" fill="#38BDF8" font-size="11.5" font-weight="700" text-anchor="middle">v1 routes · JWT · rate limit</text>
    <text x="92" y="48" fill="#64748B" font-size="9.5" text-anchor="middle">App / USSD / Agent Ingress</text>
  </g>

  <!-- ==================== 3. BACKEND CORE SERVICES (BIG CENTER BOX) ==================== -->
  <g transform="translate(545, 115)">
    <!-- Container -->
    <rect x="0" y="0" width="685" height="430" rx="10" fill="#181D28" stroke="#2B3344" stroke-width="1.2" />
    <text x="342" y="32" fill="#94A3B8" font-size="12" font-weight="600" text-anchor="middle">TakaSafe Core Services (Express &amp; Python ML Runtime)</text>

    <!-- Central Hub: Model services -->
    <g transform="translate(35, 175)">
      <rect x="0" y="0" width="165" height="64" rx="8" fill="#0F131D" stroke="#38BDF8" stroke-width="1.5" />
      <text x="82" y="30" fill="#F8FAFC" font-size="13" font-weight="700" text-anchor="middle">Model services</text>
      <text x="82" y="48" fill="#38BDF8" font-size="10" font-weight="600" text-anchor="middle">XGBoost + Anomaly</text>
    </g>

    <!-- Branch 1: Top (Policy rules -> Gemini Brief) -->
    <g transform="translate(265, 48)">
      <rect x="0" y="0" width="150" height="56" rx="6" fill="#0F131D" stroke="#2B3344" stroke-width="1" />
      <text x="75" y="27" fill="#F1F5F9" font-size="11.5" font-weight="600" text-anchor="middle">Policy · Dynamic Rules</text>
      <text x="75" y="43" fill="#64748B" font-size="9" text-anchor="middle">4-Tier Action Thresholds</text>
    </g>

    <g transform="translate(465, 48)">
      <rect x="0" y="0" width="190" height="56" rx="6" fill="#0F131D" stroke="#C084FC" stroke-width="1.3" />
      <text x="95" y="26" fill="#F8FAFC" font-size="12" font-weight="700" text-anchor="middle">Brief: Gemini 2.5 Flash</text>
      <text x="95" y="42" fill="#C084FC" font-size="9.5" text-anchor="middle">+ validator + cache</text>
    </g>

    <!-- Branch 2: Middle (Database / Ledger Cylinder) -->
    <g transform="translate(265, 172)">
      <rect x="0" y="10" width="170" height="50" fill="#0F131D" stroke="#2B3344" stroke-width="1" />
      <ellipse cx="85" cy="10" rx="85" ry="10" fill="#1C2230" stroke="#2B3344" stroke-width="1" />
      <ellipse cx="85" cy="60" rx="85" ry="10" fill="#0F131D" stroke="#2B3344" stroke-width="1" />
      <text x="85" y="38" fill="#F1F5F9" font-size="12" font-weight="600" text-anchor="middle">Database / Ledger</text>
      <text x="85" y="52" fill="#64748B" font-size="9.5" text-anchor="middle">cases · actions · audit</text>
    </g>

    <!-- Branch 3: Bottom (Artifacts Cylinder) -->
    <g transform="translate(265, 290)">
      <rect x="0" y="10" width="170" height="54" fill="#0F131D" stroke="#34D399" stroke-width="1.2" />
      <ellipse cx="85" cy="10" rx="85" ry="10" fill="#1C2230" stroke="#34D399" stroke-width="1.2" />
      <ellipse cx="85" cy="64" rx="85" ry="10" fill="#0F131D" stroke="#34D399" stroke-width="1.2" />
      <text x="85" y="36" fill="#34D399" font-size="12" font-weight="700" text-anchor="middle">artifacts/: models</text>
      <text x="85" y="52" fill="#94A3B8" font-size="9.5" text-anchor="middle">calibrators · forecasts · JSON</text>
    </g>

    <!-- Inner Service Connections -->
    <!-- Model services -> Policy -->
    <path d="M 200 195 C 235 195, 235 76, 260 76" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-gray)" />

    <!-- Policy -> Gemini -->
    <line x1="415" y1="76" x2="459" y2="76" stroke="#C084FC" stroke-width="1.5" marker-end="url(#arr-purple)" />

    <!-- Model services -> Database -->
    <line x1="200" y1="207" x2="259" y2="207" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-gray)" />

    <!-- Model services -> Artifacts -->
    <path d="M 200 220 C 235 220, 235 320, 260 320" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-gray)" />
  </g>

  <!-- ==================== 4. OFFLINE ML NOTEBOOK (BOTTOM) ==================== -->
  <g transform="translate(450, 580)">
    <rect x="0" y="0" width="280" height="95" rx="8" fill="#181D28" stroke="#2B3344" stroke-width="1.2" />
    <text x="140" y="26" fill="#94A3B8" font-size="11.5" font-weight="600" text-anchor="middle">Jupyter / Kaggle Notebooks NB00-NB99</text>

    <!-- Sub-box -->
    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="240" height="42" rx="6" fill="#0F131D" stroke="#A3E635" stroke-width="1" />
      <text x="120" y="26" fill="#F1F5F9" font-size="11.5" font-weight="600" text-anchor="middle">Train · calibrate · evaluate · export</text>
    </g>
  </g>

  <!-- ==================== GLOBAL CONNECTING ARROWS ==================== -->

  <!-- Frontend -> Gateway arrows -->
  <path d="M 270 200 C 295 200, 295 315, 312 315" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-gray)" />
  <path d="M 270 282 C 295 282, 295 322, 312 322" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-gray)" />
  <path d="M 270 365 C 295 365, 295 330, 312 330" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-gray)" />
  <path d="M 270 447 C 295 447, 295 338, 312 338" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arr-gray)" />

  <!-- Gateway -> Backend Model Services -->
  <line x1="500" y1="322" x2="573" y2="322" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arr-cyan)" />

  <!-- Notebook -> Artifacts (Curved Upwards) -->
  <path d="M 710 638 C 840 638, 845 520, 850 445" fill="none" stroke="#34D399" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-green)" />
  
  <!-- Label on dashed arrow -->
  <rect x="745" y="555" width="112" height="22" rx="4" fill="#151A24" stroke="#2B3344" />
  <text x="801" y="570" fill="#34D399" font-size="10" font-weight="700" text-anchor="middle">artifacts + reports</text>
</svg>
